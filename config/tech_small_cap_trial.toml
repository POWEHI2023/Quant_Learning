[backtest]
# 试用权限为前 15 个月至前 3 个月；起点额外预留流动性回看窗口。
start_date = "2025-08-01"
end_date = "2026-05-22"
initial_cash = 1000000.0
benchmark = "000300.XSHG"
rebalance = "monthly"

[strategy]
industry_codes = ["801080", "801750", "801770"]
enabled_filters = [
  "exchange",
  "listing_age",
  "st",
  "liquidity",
  "profitability",
  "debt_ratio",
  "growth",
  "valuation",
  "market_cap",
]
hold_count = 30
min_listing_days = 1190
max_listing_days = -1
liquidity_lookback_days = 20
min_average_turnover = 10000000.0
allowed_exchange_suffixes = ["XSHG", "XSHE"]
min_roe = 5.0
max_debt_ratio = 0.70
min_revenue_growth = 0.0
min_net_profit_growth = 0.0
min_pe_ratio = 0.0
max_pe_ratio = 100.0
min_pb_ratio = 0.0
max_pb_ratio = 10.0
cash_buffer = 0.02

[costs]
commission_rate = 0.0003
minimum_commission = 5.0
stamp_duty_rate = 0.0005
transfer_fee_rate = 0.00001
slippage_bps = 5.0
lot_size = 100

[metrics]
risk_free_rate = 0.02
annual_trading_days = 252
